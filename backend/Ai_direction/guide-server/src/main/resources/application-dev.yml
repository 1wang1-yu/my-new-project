server:
  port: 8081

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=smart_guide_db;encrypt=false;trustServerCertificate=true
    username: sa
    password: your-db-password
  ai:
    openai:
      api-key: your-dashscope-api-key
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3.5-flash

guide:
  whisper:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: your-dashscope-api-key
    transcribe-path: /audio/transcriptions
    model: whisper-1
  chroma:
    base-url: http://localhost:8000
    default-collection: travel_kb
  tts:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: your-dashscope-api-key
  tencent-cloud:
    secret-id: your-tencent-secret-id
    secret-key: your-tencent-secret-key
    region: ap-guangzhou
    tts-endpoint: tts.tencentcloudapi.com
    virtualman-key: "your-virtualman-key"
    app-key: "your-app-key"
    access-token: "your-access-token"
db:
  url: jdbc:sqlserver://localhost:1433;databaseName=smart_guide_db;encrypt=false;trustServerCertificate=true
  port: 1433
  host: localhost
  username: sa
  name: smart_guide_db
  password: your-db-password
  driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
